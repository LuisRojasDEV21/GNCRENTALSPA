<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Página no encontrada — GNC Rental SPA</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600;700&family=Segoe+UI:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/estilos.css">

    <style>
        .error-container {
            min-height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            background-color: #F5F5DC;
        }

        .error-code {
            font-family: 'Oswald', sans-serif;
            font-size: 8rem;
            font-weight: 700;
            color: var(--naranja, #F37021);
            line-height: 1;
            margin-bottom: 0;
            text-shadow: 4px 4px 0px rgba(0,0,0,0.05);
        }

        .error-message {
            font-family: 'Oswald', sans-serif;
            font-size: 2rem;
            color: var(--texto-oscuro, #111111);
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        .error-desc {
            color: var(--texto-suave, #555555);
            max-width: 500px;
            font-size: 1.1rem;
            margin-bottom: 2.5rem;
        }

        .btn-volver {
            background-color: var(--azul, #00AEEF);
            color: white;
            font-family: 'Oswald', sans-serif;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 0.8rem 2.5rem;
            border-radius: 4px;
            text-decoration: none;
            font-weight: bold;
            transition: background 0.3s;
        }

            .btn-volver:hover {
                background-color: #008cc0;
                color: white;
            }
    </style>
</head>
<body>

    <gnc-header></gnc-header>

    <main class="error-container px-3">
        <h1 class="error-code">404</h1>
        <h2 class="error-message">¡Ups! Máquina no encontrada</h2>
        <p class="error-desc">Parece que el enlace que buscas no existe o la máquina que intentas ver ya no está en esta ruta. No te preocupes, nuestra flota sigue operativa.</p>
        <a href="/" class="btn-volver">Volver al Catálogo</a>
    </main>

    <gnc-footer-simple></gnc-footer-simple>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/main.js"></script>
</body>
</html>
